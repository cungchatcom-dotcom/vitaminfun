# ASCII ONLY. Alembic doc file nay bang encoding cua he dieu hanh
# (read_config_parser(..., encoding="locale")). Tren Windows do la cp1252, nen
# mot dau tieng Viet o day lam vo lenh alembic bang UnicodeDecodeError.
# Chu tieng Viet co dau chi duoc nam trong file .py.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Ten file migration co timestamp de sap xep theo thoi gian khi doc thu muc.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# KHONG dat sqlalchemy.url o day. alembic/env.py doc tu settings, tuc tu .env.
# De chuoi ket noi o hai noi la cach chac chan de co ngay migrate nham database.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
