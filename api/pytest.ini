# ASCII ONLY -- cung ly do voi alembic.ini: file .ini duoc doc bang encoding cua
# he dieu hanh, tren Windows la cp1252. Chu tieng Viet co dau chi de trong .py.

[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning:app.*
